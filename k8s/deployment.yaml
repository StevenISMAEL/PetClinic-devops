apiVersion: apps/v1
kind: Deployment
metadata:
  name: petclinic-deployment
  namespace: devops-lab
  labels:
    app: petclinic
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: petclinic
  template:
    metadata:
      labels:
        app: petclinic
    spec:
      containers:
      - name: petclinic

        image: ghcr.io/stevenismael/petclinic-devops/petclinic:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        
        # Inyectamos las variables de entorno para la Base de Datos
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "postgres"
        # --- NUEVA VARIABLE DESDE CONFIGMAP ---
        - name: LOGGING_LEVEL_ORG_SPRINGFRAMEWORK
          valueFrom:
            configMapKeyRef:
              name: petclinic-config
              key: LOG_LEVEL
        # --------------------------------------
        - name: POSTGRES_URL
          valueFrom:
            secretKeyRef:
              name: petclinic-db-secret
              key: POSTGRES_URL
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: petclinic-db-secret
              key: POSTGRES_USER
        - name: POSTGRES_PASS
          valueFrom:
            secretKeyRef:
              name: petclinic-db-secret
              key: POSTGRES_PASS

        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1024Mi"
            cpu: "500m"
            
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 120
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 120
          periodSeconds: 10