# =============================================================================
# ConfigMap - Dashboard de SLO de PetClinic para Grafana
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: petclinic-slo-dashboard
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  petclinic-slo.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "title": "🎯 SLO: Disponibilidad (Target: 99.9%)",
          "type": "gauge",
          "gridPos": { "h": 8, "w": 6, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "1 - (sum(rate(http_server_requests_seconds_count{namespace=~\"staging|devops-lab\", status=~\"5..\"}[5m])) / sum(rate(http_server_requests_seconds_count{namespace=~\"staging|devops-lab\"}[5m])))",
              "legendFormat": "Disponibilidad"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0.99,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "orange", "value": 0.995 },
                  { "color": "green", "value": 0.999 }
                ]
              }
            }
          }
        },
        {
          "title": "⏱️ Latencia P99 (Target: < 2s)",
          "type": "gauge",
          "gridPos": { "h": 8, "w": 6, "x": 6, "y": 0 },
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum(rate(http_server_requests_seconds_bucket{namespace=~\"staging|devops-lab\"}[5m])) by (le))",
              "legendFormat": "P99 Latency"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 1 },
                  { "color": "red", "value": 2 }
                ]
              }
            }
          }
        },
        {
          "title": "📊 Error Budget Restante (30 días)",
          "type": "stat",
          "gridPos": { "h": 8, "w": 6, "x": 12, "y": 0 },
          "targets": [
            {
              "expr": "1 - ((1 - (1 - sum(rate(http_server_requests_seconds_count{namespace=~\"staging|devops-lab\", status=~\"5..\"}[30d])) / sum(rate(http_server_requests_seconds_count{namespace=~\"staging|devops-lab\"}[30d])))) / 0.001)",
              "legendFormat": "Error Budget"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "orange", "value": 0.25 },
                  { "color": "green", "value": 0.5 }
                ]
              }
            }
          }
        },
        {
          "title": "🏥 Estado de Pods PetClinic",
          "type": "stat",
          "gridPos": { "h": 8, "w": 6, "x": 18, "y": 0 },
          "targets": [
            {
              "expr": "sum(kube_pod_status_ready{namespace=~\"staging|devops-lab\", pod=~\"petclinic.*\", condition=\"true\"})",
              "legendFormat": "Pods Ready"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 1 }
                ]
              }
            }
          }
        },
        {
          "title": "📈 Tasa de Requests por Segundo",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_count{namespace=~\"staging|devops-lab\"}[1m])) by (status)",
              "legendFormat": "HTTP {{status}}"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "reqps" }
          }
        },
        {
          "title": "📈 Latencia por Endpoint (P50, P95, P99)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum(rate(http_server_requests_seconds_bucket{namespace=~\"staging|devops-lab\"}[5m])) by (le))",
              "legendFormat": "P50"
            },
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{namespace=~\"staging|devops-lab\"}[5m])) by (le))",
              "legendFormat": "P95"
            },
            {
              "expr": "histogram_quantile(0.99, sum(rate(http_server_requests_seconds_bucket{namespace=~\"staging|devops-lab\"}[5m])) by (le))",
              "legendFormat": "P99"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "s" }
          }
        },
        {
          "title": "🧠 Uso de Memoria JVM (Heap)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "targets": [
            {
              "expr": "jvm_memory_used_bytes{namespace=~\"staging|devops-lab\", area=\"heap\"}",
              "legendFormat": "Usado"
            },
            {
              "expr": "jvm_memory_max_bytes{namespace=~\"staging|devops-lab\", area=\"heap\"}",
              "legendFormat": "Máximo"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "bytes" }
          }
        },
        {
          "title": "🔄 Reinicios de Pods",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "targets": [
            {
              "expr": "kube_pod_container_status_restarts_total{namespace=~\"staging|devops-lab\", pod=~\"petclinic.*\"}",
              "legendFormat": "{{ pod }}"
            }
          ]
        }
      ],
      "schemaVersion": 39,
      "tags": ["petclinic", "slo", "devops"],
      "templating": { "list": [] },
      "time": { "from": "now-1h", "to": "now" },
      "title": "PetClinic - SLO Dashboard",
      "uid": "petclinic-slo"
    }
