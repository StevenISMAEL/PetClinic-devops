# =============================================================================
# kube-prometheus-stack - Configuración ULTRA-LIGERA para cluster 2 nodos
# =============================================================================

# --- Grafana ---
grafana:
  enabled: true
  adminPassword: "PetClinic2026!"
  grafana.ini:
    server:
      root_url: "%(protocol)s://%(domain)s/"
      serve_from_sub_path: false
    security:
      cookie_secure: false
      allow_embedding: true
    auth:
      disable_login_form: false
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 150m
      memory: 256Mi
  # Desactivar sidecars pesados
  sidecar:
    dashboards:
      enabled: true
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 50m
          memory: 64Mi
    datasources:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 50m
          memory: 64Mi
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: 'custom'
          orgId: 1
          folder: 'PetClinic'
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/custom
  dashboardsConfigMaps:
    custom: "petclinic-slo-dashboard"

# --- Prometheus Server ---
prometheus:
  prometheusSpec:
    retention: 12h
    resources:
      requests:
        cpu: 50m
        memory: 200Mi
      limits:
        cpu: 300m
        memory: 400Mi
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

# --- Alertmanager ---
alertmanager:
  enabled: true
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ['alertname', 'job']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 3h
      receiver: 'default'
      routes:
        - matchers:
            - notify="teams"
          receiver: 'teams-webhook'
    receivers:
      - name: 'default'
      - name: 'teams-webhook'
        webhook_configs:
          - url: 'https://default8dbe1469c79c4e219d43ca65d9e9c4.75.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/fb53cca9965c46389173c67f7b2125d6/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=vw6YR5DGAWU9DijjTbZEYro9_N6n6ORAB_fi2tHleQo'
            send_resolved: true
  alertmanagerSpec:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 50m
        memory: 64Mi

# --- Node Exporter ---
nodeExporter:
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 50m
      memory: 32Mi

# --- Kube State Metrics ---
kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 50m
      memory: 32Mi

# --- Prometheus Operator ---
prometheusOperator:
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
  # Reducir webhook para ahorrar recursos
  admissionWebhooks:
    patch:
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 32Mi
