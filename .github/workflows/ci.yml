name: CI/CD Pipeline - Spring PetClinic

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build, Test & SAST
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # --- PASO DEVSECOPS: ESCANEO DE SECRETOS ---
    - name: Run Gitleaks
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Compile and Run Unit Tests with Maven
      run: |
        cd app
        mvn clean verify

    # --- PASO DEVSECOPS: ANÁLISIS ESTÁTICO DE CALIDAD ---
    - name: SonarCloud Scan
      uses: SonarSource/sonarcloud-github-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        projectBaseDir: app
        args: >
          -Dsonar.projectKey=StevenISMAEL_PetClinic-devops2
          -Dsonar.organization=stevenismael
          -Dsonar.qualitygate.wait=true
          -Dsonar.java.binaries=target/classes

  docker-build:
    name: Containerize & Security Scan
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry (GHCR)
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # --- PASO DEVSECOPS: ESCANEO DE VULNERABILIDADES ---
    - name: Build local image for security scan
      run: |
        docker build -t petclinic:test ./app

    - name: Run Trivy Vulnerability Scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'petclinic:test'
        format: 'table'
        exit-code: '1'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL'

    - name: Push Image to GHCR
      uses: docker/build-push-action@v5
      with:
        context: ./app
        push: true
        tags: |
          ghcr.io/${{ github.repository }}/petclinic:latest
          ghcr.io/${{ github.repository }}/petclinic:${{ github.sha }}

  deploy-staging:
    name: Deploy to Staging & DAST
    needs: docker-build
    runs-on: ubuntu-latest
    environment: staging
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Deploy to Staging K8s
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          kubectl set image deployment/petclinic petclinic=ghcr.io/${{ github.repository }}/petclinic:${{ github.sha }} -n staging
          kubectl rollout status deployment/petclinic -n staging

    # --- PASO DEVSECOPS: ESCANEO DINÁMICO (DAST) ---
    - name: OWASP ZAP Baseline Scan (DAST)
      uses: zaproxy/action-baseline@v0.12.0
      with:
        target: 'http://${{ secrets.EC2_HOST }}:8080'
        fail_action: false

  deploy-production:
    name: Deploy to Production
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: 
      name: production
      
    steps:
    - name: Deploy to Production K8s
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          kubectl set image deployment/petclinic petclinic=ghcr.io/${{ github.repository }}/petclinic:${{ github.sha }} -n production
          kubectl rollout status deployment/petclinic -n production