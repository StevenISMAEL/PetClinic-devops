name: CI/CD Pipeline - Spring PetClinic (Azure & AKS)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build, Test & SAST
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # --- PASO DEVSECOPS: ESCANEO DE SECRETOS ---
    - name: Run Gitleaks
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Compile and Run Unit Tests with Maven
      run: |
        cd app
        mvn clean verify

    # --- PASO DEVSECOPS: ANÁLISIS ESTÁTICO DE CALIDAD ---
    - name: SonarCloud Scan
      uses: SonarSource/sonarcloud-github-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        projectBaseDir: app
        args: >
          -Dsonar.projectKey=StevenISMAEL_PetClinic-devops2
          -Dsonar.organization=stevenismael
          -Dsonar.qualitygate.wait=true
          -Dsonar.java.binaries=target/classes
  docker-build:
    name: Containerize & Security Scan
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # --- PASO DEVSECOPS: ESCANEO DE VULNERABILIDADES (TRIVY) ---
    - name: Build local image for security scan
      run: |
        docker build -t petclinic:test ./app

    - name: Run Trivy Vulnerability Scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'petclinic:test'
        format: 'table'
        exit-code: '1'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL'

    - name: Convert repository name to lowercase
      run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

    - name: Log in to GitHub Container Registry (GHCR)
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Push Image to GHCR
      uses: docker/build-push-action@v5
      with:
        context: ./app
        push: true
        tags: |
          ghcr.io/${{ env.REPO_LC }}/petclinic:latest
          ghcr.io/${{ env.REPO_LC }}/petclinic:${{ github.sha }}

  # --- PASO IAC: APROVISIONAMIENTO EN AZURE CON TERRAFORM ---
  terraform-deploy:
    name: Provision Infrastructure (Terraform)
    needs: docker-build
    runs-on: ubuntu-latest
    # Solo ejecuta Terraform si estamos en la rama principal (producción)
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }} # Pasamos la contraseña segura a Terraform
    defaults:
      run:
        working-directory: ./terraform
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Terraform Init
      run: terraform init

    - name: Terraform Format & Validate
      run: |
        terraform fmt -check
        terraform validate

    - name: Terraform Apply
      run: terraform apply -auto-approve

  # --- PASO CD: DESPLIEGUE A KUBERNETES (AKS) ---
  deploy-to-aks:
    name: Deploy to Azure Kubernetes Service
    needs: terraform-deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Set up Kubectl
      uses: azure/setup-kubectl@v3

    - name: Get AKS Credentials
      run: az aks get-credentials --resource-group rg-petclinic-devops --name aks-petclinic

    - name: Deploy to Kubernetes
      run: |
        # 1. Aseguramos que el namespace exista y esperamos a que esté listo
        kubectl apply -f k8s/namespace.yaml
        # 2. Esperamos unos segundos para que la API de Kubernetes lo procese
        sleep 10
        # 3. Aplicamos el secreto primero (para que el deployment no falle por falta de credenciales)
        kubectl apply -f k8s/db-secret.yaml
        # 4. Aplicamos el resto
        kubectl apply -f k8s/
        
