name: CI/CD Pipeline - Spring PetClinic (GCP & GKE)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build, Test & SAST
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # --- PASO DEVSECOPS: ESCANEO DE SECRETOS ---
    - name: Run Gitleaks
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Compile and Run Unit Tests with Maven
      run: |
        cd app
        mvn clean verify

    # --- PASO DEVSECOPS: ANÁLISIS ESTÁTICO DE CALIDAD ---
    - name: SonarCloud Scan
      uses: SonarSource/sonarcloud-github-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        projectBaseDir: app
        args: >
          -Dsonar.projectKey=StevenISMAEL_PetClinic-devops2
          -Dsonar.organization=stevenismael
          -Dsonar.qualitygate.wait=true
          -Dsonar.java.binaries=target/classes

  docker-build:
    name: Containerize & Security Scan
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # --- PASO DEVSECOPS: ESCANEO DE VULNERABILIDADES (TRIVY) ---
    - name: Build local image for security scan
      run: |
        docker build -t petclinic:test ./app

    - name: Run Trivy Vulnerability Scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'petclinic:test'
        format: 'table'
        exit-code: '1'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL'

    - name: Convert repository name to lowercase
      run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

    - name: Log in to GitHub Container Registry (GHCR)
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Push Image to GHCR
      uses: docker/build-push-action@v5
      with:
        context: ./app
        push: true
        tags: |
          ghcr.io/${{ env.REPO_LC }}/petclinic:latest
          ghcr.io/${{ env.REPO_LC }}/petclinic:${{ github.sha }}

  # --- PASO IAC: APROVISIONAMIENTO EN GCP CON TERRAFORM ---
  terraform-deploy:
    name: Provision Infrastructure (Terraform)
    needs: docker-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    env:
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
    defaults:
      run:
        working-directory: ./terraform
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Terraform Init
      run: terraform init

    - name: Terraform Format & Validate
      run: |
        terraform fmt -check
        terraform validate

    - name: Terraform Apply
      run: terraform apply -auto-approve

  # --- PASO CD: DESPLIEGUE A STAGING (AUTOMÁTICO) ---
  deploy-staging:
    name: Deploy to Staging Environment
    needs: terraform-deploy
    runs-on: ubuntu-latest
    environment: staging
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Get GKE Credentials
      uses: google-github-actions/get-gke-credentials@v2
      with:
        cluster_name: gke-petclinic
        location: us-central1-a
        project_id: ${{ secrets.GCP_PROJECT_ID }}

    - name: Deploy to Kubernetes (Staging)
      env:
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      run: |
        echo "Obteniendo IP de Cloud SQL..."
        SQL_IP=$(gcloud sql instances describe petclinic-postgres --format='value(ipAddresses[0].ipAddress)' --project=${{ secrets.GCP_PROJECT_ID }})
        echo "Cloud SQL IP: ${SQL_IP}"

        echo "Modificando YAMLs para apuntar a Staging..."
        sed -i 's/devops-lab/staging/g' k8s/*.yaml k8s/*.yml

        echo "Inyectando IP de Cloud SQL y contraseña en el secret..."
        sed -i "s|CLOUD_SQL_IP|${SQL_IP}|g" k8s/db-secret.yaml
        sed -i "s|DB_PASSWORD_PLACEHOLDER|${DB_PASSWORD}|g" k8s/db-secret.yaml

        kubectl apply -f k8s/namespace.yaml
        sleep 5
        kubectl apply -f k8s/db-secret.yaml
        kubectl apply -f k8s/

    - name: Deploy Observability Stack
      run: |
        kubectl create namespace observability --dry-run=client -o yaml | kubectl apply -f -
        helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
        helm repo add grafana https://grafana.github.io/helm-charts
        helm repo update
        helm upgrade --install prometheus prometheus-community/kube-prometheus-stack \
          --namespace observability \
          --create-namespace
        helm upgrade --install grafana grafana/grafana \
          --namespace observability \
          --create-namespace

      # --- PASO DEVSECOPS: ESCANEO DINÁMICO (DAST) CON OWASP ZAP ---
  dast-scan:
    name: OWASP ZAP Security Scan (Staging)
    needs: deploy-staging
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      issues: write
    steps:
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Get GKE Credentials
      uses: google-github-actions/get-gke-credentials@v2
      with:
        cluster_name: gke-petclinic
        location: us-central1-a
        project_id: ${{ secrets.GCP_PROJECT_ID }}

    - name: Retrieve Staging IP
      run: |
        echo "Esperando a que GCP asigne la IP pública a Staging..."
        STAGING_IP=""
        while [ -z "$STAGING_IP" ]; do
          sleep 10
          STAGING_IP=$(kubectl get svc petclinic-service -n staging -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
        done
        echo "IP de Staging encontrada: $STAGING_IP"
        
        echo "Esperando a que la aplicación responda (HTTP 200)..."
        # Bucle que espera hasta que la app responda correctamente
        while ! curl -s --max-time 5 -o /dev/null -w "%{http_code}" http://$STAGING_IP/ | grep -q "200"; do
          echo "Esperando a que el LoadBalancer y la app estén listos en http://$STAGING_IP/..."
          sleep 10
        done
        
        echo "¡Aplicación lista!"
        echo "TARGET_URL=http://$STAGING_IP" >> $GITHUB_ENV

    - name: Run OWASP ZAP Baseline Scan
      uses: zaproxy/action-baseline@v0.12.0
      with:
        target: ${{ env.TARGET_URL }}
        fail_action: false

  # --- PASO CD: DESPLIEGUE A PRODUCCIÓN (REQUIERE APROBACIÓN) ---
  deploy-production:
    name: Deploy to Production Environment
    needs: dast-scan
    runs-on: ubuntu-latest
    environment: production
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Get GKE Credentials
      uses: google-github-actions/get-gke-credentials@v2
      with:
        cluster_name: gke-petclinic
        location: us-central1-a
        project_id: ${{ secrets.GCP_PROJECT_ID }}

    - name: Deploy to Kubernetes (Production)
      env:
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      run: |
        echo "Obteniendo IP de Cloud SQL..."
        SQL_IP=$(gcloud sql instances describe petclinic-postgres --format='value(ipAddresses[0].ipAddress)' --project=${{ secrets.GCP_PROJECT_ID }})

        echo "Inyectando IP de Cloud SQL y contraseña en el secret..."
        sed -i "s|CLOUD_SQL_IP|${SQL_IP}|g" k8s/db-secret.yaml
        sed -i "s|DB_PASSWORD_PLACEHOLDER|${DB_PASSWORD}|g" k8s/db-secret.yaml

        echo "Desplegando en Producción (devops-lab)..."
        kubectl apply -f k8s/namespace.yaml
        sleep 5
        kubectl apply -f k8s/db-secret.yaml
        kubectl apply -f k8s/
